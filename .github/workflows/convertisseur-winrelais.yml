name: Convertisseur WinRelais (exe Windows)
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: convertisseur-winrelais
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test de conversion (script)
        run: python convertisseur.py exemple_depart_moteur.json -o test_script.xrs
      - name: Build
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name ConvertisseurWinRelais --add-data "bibliotheque.xrs;." --exclude-module matplotlib convertisseur.py
      - name: Test de l'exe
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath dist\ConvertisseurWinRelais.exe -ArgumentList "exemple_depart_moteur.json","-o","test_exe.xrs"
          if (-not (Test-Path test_exe.xrs)) { throw "l'exe n'a pas produit de fichier" }
          if ((Get-FileHash test_exe.xrs).Hash -ne (Get-FileHash test_script.xrs).Hash) { throw "sortie differente du script" }
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertisseurWinRelais
          path: convertisseur-winrelais/dist/ConvertisseurWinRelais.exe
