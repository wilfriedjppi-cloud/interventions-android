name: Build APK
on:
  push:
    paths-ignore: ['page/**', 'tools/**', '.github/workflows/page.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Bibliothèques hors connexion (lecteur PDF, OCR, tableur, remplissage PDF)
        run: |
          mkdir -p /tmp/l && cd /tmp/l && npm init -y > /dev/null
          npm i --no-audit --no-fund tesseract.js@5.1.1 pdfjs-dist@3.11.174 xlsx@0.18.5 leaflet@1.9.4 pdf-lib@1.17.1
          A=$GITHUB_WORKSPACE/app/src/main/assets/lib
          mkdir -p $A/pdfjs $A/xlsx $A/tess $A/tess-core $A/tessdata
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js $A/pdfjs/
          cp node_modules/xlsx/dist/xlsx.full.min.js $A/xlsx/
          mkdir -p $A/pdflib && cp node_modules/pdf-lib/dist/pdf-lib.min.js $A/pdflib/
          mkdir -p $A/leaflet && cp -r node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css node_modules/leaflet/dist/images $A/leaflet/
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js $A/tess/
          ls node_modules/tesseract.js-core/
          cp node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm.js node_modules/tesseract.js-core/tesseract-core-lstm.wasm.js $A/tess-core/
          cp node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm node_modules/tesseract.js-core/tesseract-core-lstm.wasm $A/tess-core/ 2>/dev/null || true
          for l in fra eng; do curl -fsSL --retry 3 -o $A/tessdata/$l.traineddata.gz https://tessdata.projectnaptha.com/4.0.0/$l.traineddata.gz; done
          du -sh $A/*; ls -la $A/*
      - name: Compilation
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Interventions.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Interventions-apk
          path: Interventions.apk
      - name: Publication (onglet Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "appli-${{ github.run_number }}" Interventions.apk --repo "${{ github.repository }}" --title "Interventions - appli ${{ github.run_number }}" --notes "APK a installer sur le telephone (ouvrir Interventions.apk)." --latest
