name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilation
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Interventions.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Interventions-apk
          path: Interventions.apk
