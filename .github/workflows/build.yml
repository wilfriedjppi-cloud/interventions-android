name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilation
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Interventions.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Interventions-apk
          path: Interventions.apk
      - name: Publication (onglet Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "appli-${{ github.run_number }}" Interventions.apk --repo "${{ github.repository }}" --title "Interventions - appli ${{ github.run_number }}" --notes "APK a installer sur le telephone (ouvrir Interventions.apk)." --latest
